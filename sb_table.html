<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Table</title>
  <link rel="stylesheet" href="style.css">
  <style>
    table {
      margin: 30px auto;
      border-collapse: collapse;
      background-color: rgba(255, 255, 255, 0.35);
      text-align: center;
    }

    th,
    td {
      width: 120px;
      height: 55px;
      border: 2px solid rgb(105, 78, 20);
      padding: 10px;
    }

    th {
      background-color: rgb(191, 211, 182);
    }
  </style>
</head>

<body>
  <h1>Time Table</h1>
  <hr>

  <table>
    <tr>
      <th scope="col"></th>
      <th scope="col">Mon</th>
      <th scope="col">Wed</th>
      <th scope="col">Fri</th>
    </tr>
    <tr>
      <th scope="row">AM</th>
      <td>word</td>
      <td></td>
      <td></td>
    </tr>
    <tr>
      <th scope="row">PM</th>
      <td>excel</td>
      <td></td>
      <td>word</td>
    </tr>
    <tr>
      <th scope="row">OT</th>
      <td>ppt</td>
      <td></td>
      <td>ppt</td>

    </tr>
  </table>
</body>

</html>
